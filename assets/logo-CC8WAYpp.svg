<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Outer Hexagon Glossy Violet Gradient -->
    <linearGradient id="pgonHexGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="35%" stop-color="#7B2CBF"/>
      <stop offset="70%" stop-color="#5A189A"/>
      <stop offset="100%" stop-color="#3C096C"/>
    </linearGradient>
    
    <!-- Chamfered Bevel Specular Rim Light -->
    <linearGradient id="pgonBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0AAFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#C77DFF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7B2CBF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E0AAFF" stop-opacity="0.85"/>
    </linearGradient>
    
    <!-- Deep Midnight Purple Recessed Cavity for Debossed Bird -->
    <linearGradient id="pgonInnerCavity" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#140228"/>
      <stop offset="100%" stop-color="#090114"/>
    </linearGradient>

    <!-- Ultraviolet Edge Neon Inner Glow Filter -->
    <filter id="pgonNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#C77DFF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Hexagon Base -->
  <path d="M 46.5 6.2 C 48.6 5.0 51.4 5.0 53.5 6.2 L 87.5 25.8 C 89.6 27.0 91.0 29.4 91.0 31.8 L 91.0 70.2 C 91.0 72.6 89.6 75.0 87.5 76.2 L 53.5 95.8 C 51.4 97.0 48.6 97.0 46.5 95.8 L 12.5 76.2 C 10.4 75.0 9.0 72.6 9.0 70.2 L 9.0 31.8 C 9.0 29.4 10.4 27.0 12.5 25.8 Z" fill="url(#pgonHexGrad)"/>
  
  <!-- Outer Bevel Stroke with Specular Highlights -->
  <path d="M 46.5 6.2 C 48.6 5.0 51.4 5.0 53.5 6.2 L 87.5 25.8 C 89.6 27.0 91.0 29.4 91.0 31.8 L 91.0 70.2 C 91.0 72.6 89.6 75.0 87.5 76.2 L 53.5 95.8 C 51.4 97.0 48.6 97.0 46.5 95.8 L 12.5 76.2 C 10.4 75.0 9.0 72.6 9.0 70.2 L 9.0 31.8 C 9.0 29.4 10.4 27.0 12.5 25.8 Z" stroke="url(#pgonBevelGrad)" stroke-width="2.6" fill="none"/>

  <!-- Debossed Bird Emblem with Neon Edge Lighting -->
  <g filter="url(#pgonNeonGlow)">
    <!-- Upper Wing Feather Blade -->
    <path d="M 21 32 C 26.5 34 37.5 39 49 48.5 C 42 52.5 33 53.5 24 46 C 20 42.5 19.5 34 21 32 Z" fill="url(#pgonInnerCavity)" stroke="#C084FC" stroke-width="1.3"/>
    
    <!-- Lower Wing Feather Blade -->
    <path d="M 23 46.5 C 30.5 49 42.5 55.5 50.5 66.5 C 44 69.5 35 68.5 27 61 C 22.5 57 21.5 49.5 23 46.5 Z" fill="url(#pgonInnerCavity)" stroke="#C084FC" stroke-width="1.3"/>
    
    <!-- Pigeon Head, Beak & S-curved Body -->
    <path d="M 54 25.5 C 45 25.5 39 32 40 41 C 41 49 45.5 58.5 53 66.5 C 60.5 73 68 67.5 70 62.5 C 72 57.5 71.5 50.5 69.5 44.5 C 74 43.5 78 42 80 40 C 81 39 80 37.5 78.5 37.5 C 75.5 37.5 72.5 38 69.5 36 C 66.5 29.5 60.5 25.5 54 25.5 Z" fill="url(#pgonInnerCavity)" stroke="#C084FC" stroke-width="1.3"/>
    
    <!-- Debossed Circular Eye Dot -->
    <circle cx="63.5" cy="37.5" r="3.6" fill="url(#pgonInnerCavity)" stroke="#E0AAFF" stroke-width="1.3"/>
  </g>
</svg>
